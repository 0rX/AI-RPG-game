name: AI Developer Agent

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  code-agent:
    if: contains(github.event.issue.labels.*.name, 'ai-code')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run AI Agent Refactor
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        ISSUE_BODY: ${{ github.event.issue.body }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        python .github/scripts/agent_processor.py

    - name: Create Pull Request with Changes
      id: cpr
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_PAT }}
        commit-message: "ai: automatic game mechanic update from issue #${{ github.event.issue.number }}"
        title: "AI Update: ${{ github.event.issue.title }}"
        body: "This PR was generated automatically by the AI Agent in response to Issue #${{ github.event.issue.number }}."
        branch: "ai-feature-${{ github.event.issue.number }}"

    - name: Auto-Approve Pull Request
      if: steps.cpr.outputs.pull-request-operation == 'created'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
      run: |
        echo "Approving Pull Request: $PR_URL"
        gh pr review "$PR_URL" --approve --body "Automated approval from AI Developer Agent workflow using Fine-Grained Token."